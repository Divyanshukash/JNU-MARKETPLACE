# Server Configuration
server.port=8080

# MongoDB Configurations
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY:}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.path=uploads/
file.upload.allowed-types=jpg,jpeg,png,gif,webp

# CORS Configuration
cors.allowed-origins=http://localhost:3000,https://jnu-marketplace.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Logging Configuration
logging.level.com.jnu.marketplace=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.root=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n



# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method



# Security Configuration
security.jwt.header=Authorization
security.jwt.prefix=Bearer

# JNU Email Domains (for verification)
jnu.email.domains=jnu.ac.in,mail.jnu.ac.in,students.jnu.ac.in

# Application Configuration
app.name=JNU BAZAAR
app.version=1.0.0
app.description=Buy and sell platform for JNU community





# Search Configuration
search.max-results=50
search.default-page-size=20

# AI Configuration (optional. The marketplace runs with AI disabled.)
# Secrets come only from environment variables and default to empty.
app.ai.enabled=${AI_ENABLED:false}
app.ai.embedding.provider=${AI_EMBEDDING_PROVIDER:none}
app.ai.embedding.model=${AI_EMBEDDING_MODEL:text-embedding-3-small}
app.ai.embedding.api-key=${AI_EMBEDDING_API_KEY:}
app.ai.embedding.timeout=${AI_EMBEDDING_TIMEOUT:3s}
app.ai.embedding.dimension=${AI_EMBEDDING_DIMENSION:1536}
# Required when AI is enabled. No localhost default, so production never silently points at a local Qdrant.
app.ai.qdrant.url=${QDRANT_URL:}
app.ai.qdrant.api-key=${QDRANT_API_KEY:}
app.ai.qdrant.collection=${QDRANT_COLLECTION:listings}
app.ai.qdrant.timeout=${QDRANT_TIMEOUT:5s}
# Hybrid ranking weights: semantic + lexical + freshness + quality must sum to 1.0
app.ai.ranking.semantic=0.70
app.ai.ranking.lexical=0.15
app.ai.ranking.freshness=0.10
app.ai.ranking.quality=0.05
# Vector-store candidates requested per semantic query (raised automatically for deep pages)
app.ai.search.candidate-limit=200



# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25

# Scheduling Configuration
spring.task.scheduling.pool.size=5

# Profile Configuration
spring.profiles.active=dev 

server.error.include-message=always
server.error.include-binding-errors=always
